name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: businessos
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: businessos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U businessos" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://businessos:ci-only-password@localhost:5432/businessos
      AUTH_SECRET: ci-only-secret-not-used-in-production-0123456789
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm install --prefix installer --no-audit --no-fund
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx tsx prisma/seed.ts
        env:
          SEED_DEMO_PASSWORD: ci-demo-password-12345
      - run: npx playwright test
        env:
          CI: "true"
          SEED_DEMO_PASSWORD: ci-demo-password-12345
